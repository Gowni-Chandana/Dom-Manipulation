<!DOCTYPE html>
<html>
<head>
  <title>Interactive Tasks</title>
  <style>
    .product-card { border: 1px solid black; padding: 10px; margin: 5px; }
    .carousel img { width: 200px; height: 150px; }
    .comment { margin: 5px 0; }
  </style>
</head>
<body>

  <!-- 1. Shopping Cart System -->
  <ul id="cartList">
    <li>Item 1 <button onclick="addToCart('Item 1')">Add to Cart</button></li>
    <li>Item 2 <button onclick="addToCart('Item 2')">Add to Cart</button></li>
  </ul>
  <ul id="cart"></ul>
  <button onclick="removeItem()">Remove Last Item</button>

  <hr>

  <!-- 2. Live Comments Section -->
  <input type="text" id="commentInput" placeholder="Write a comment">
  <button onclick="postComment()">Post</button>
  <div id="commentsSection"></div>

  <hr>

  <!-- 3. Dynamic Form Fields -->
  <div id="formContainer"></div>
  <button onclick="addFormField()">Add Form Field</button>

  <hr>

  <!-- 4. Image Carousel -->
  <div id="carousel" class="carousel">
    <img src="https://via.placeholder.com/200x150/FF0000" alt="Image 1">
  </div>
  <button onclick="nextImage()">Next</button>
  <button onclick="prevImage()">Previous</button>

  <hr>

  <!-- 5. Cloning Product Cards -->
  <div id="productCard">
    <div class="product-card">
      <p>Product 1</p>
      <button onclick="duplicateCard()">Duplicate</button>
    </div>
  </div>

  <script>
    let cart = [];
    let currentImage = 0;
    const images = [
      "https://via.placeholder.com/200x150/FF0000",
      "https://via.placeholder.com/200x150/00FF00",
      "https://via.placeholder.com/200x150/0000FF"
    ];

    function addToCart(item) {
      cart.push(item);
      const cartList = document.getElementById("cart");
      const li = document.createElement("li");
      li.textContent = item;
      cartList.appendChild(li);
    }

    function removeItem() {
      const cartList = document.getElementById("cart");
      if (cartList.children.length > 0) {
        cartList.removeChild(cartList.lastChild);
      }
    }

    function postComment() {
      const commentInput = document.getElementById("commentInput");
      const comment = commentInput.value;
      if (comment.trim() !== "") {
        const commentDiv = document.createElement("div");
        commentDiv.classList.add("comment");
        commentDiv.textContent = comment;
        document.getElementById("commentsSection").appendChild(commentDiv);
        commentInput.value = "";
      }
    }

    function addFormField() {
      const formContainer = document.getElementById("formContainer");
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "New Form Field";
      formContainer.appendChild(input);
    }

    function nextImage() {
      currentImage = (currentImage + 1) % images.length;
      document.querySelector("#carousel img").src = images[currentImage];
    }

    function prevImage() {
      currentImage = (currentImage - 1 + images.length) % images.length;
      document.querySelector("#carousel img").src = images[currentImage];
    }

    function duplicateCard() {
      const card = document.querySelector("#productCard .product-card");
      const clone = card.cloneNode(true);
      document.getElementById("productCard").appendChild(clone);
    }
  </script>

</body>
</html>
